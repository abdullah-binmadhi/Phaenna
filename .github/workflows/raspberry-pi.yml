name: raspberry-pi-arm64

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/raspberry-pi.yml'
      - 'docs/raspberry-pi.md'
      - 'scripts/raspberry-pi/**'
  pull_request:
    paths:
      - '.github/workflows/raspberry-pi.yml'
      - 'docs/raspberry-pi.md'
      - 'scripts/raspberry-pi/**'

permissions:
  contents: read

concurrency:
  group: raspberry-pi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: scripts-shell-python-docs
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: validate shell scripts
        run: |
          bash -n scripts/raspberry-pi/*.sh
          shellcheck scripts/raspberry-pi/*.sh

      - name: compile Python helpers
        run: |
          python3 -m py_compile scripts/raspberry-pi/check_install.py scripts/raspberry-pi/merge_config.py

      - name: validate TOML merge behavior
        run: |
          tmp=$(mktemp -d)
          cat > "$tmp/config.toml" <<'TOML'
          quality = "p1080"
          [update]
          check_on_startup = false
          auto_install = false
          [cache]
          recommended_ttl = 1234
          TOML
          python3 scripts/raspberry-pi/merge_config.py "$tmp/config.toml"
          python3 - "$tmp/config.toml" <<'PY'
          import sys, tomllib
          with open(sys.argv[1], "rb") as handle:
              cfg = tomllib.load(handle)
          assert cfg["quality"] == "p1080"
          assert cfg["performance_mode"] == "efficient"
          assert cfg["shader_mode"] == "off"
          assert cfg["update"] == {"check_on_startup": False, "auto_install": False}
          assert cfg["cache"]["recommended_ttl"] == 1234
          assert cfg["cache"]["subscriptions_ttl"] == 900
          assert cfg["cache"]["history_ttl"] == 3600
          assert cfg["cache"]["watch_later_ttl"] == 21600
          PY

  arm64-smoke:
    name: debian-arm64-native-build-and-installer
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: enable arm64 emulation
        uses: docker/setup-qemu-action@v3

      - name: native ARM64 build and regression check
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$PWD:/work" -w /work \
            debian:13-slim bash -lc '
              apt-get update
              apt-get install -y build-essential pkg-config libssl-dev libsqlite3-dev ca-certificates curl git mpv ffmpeg yt-dlp file python3
              curl --fail --location --silent --show-error --retry 3 https://sh.rustup.rs -o /tmp/rustup.sh
              sh /tmp/rustup.sh -y --profile minimal --default-toolchain stable --no-modify-path
              export PATH="$HOME/.cargo/bin:$PATH"
              rustc --version
              bash scripts/raspberry-pi/build.sh --jobs 1 --dry-run
              cargo build --release --locked --jobs 1 --config "profile.release.package.phaenna.opt-level=1"
              bash -n scripts/raspberry-pi/*.sh
              python3 scripts/raspberry-pi/check_install.py /work/target/release/phaenna
            '
